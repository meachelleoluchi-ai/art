apiVersion: v1
kind: Secret
metadata:
  name: {{ include "book-catalog.fullname" . }}-secret
  labels:
    {{- include "book-catalog.labels" . | nindent 4 }}
type: Opaque
stringData:
  SECRET_KEY: {{ .Values.secrets.secretKey | quote }}
  DATABASE_PASSWORD: {{ .Values.secrets.databasePassword | quote }}
