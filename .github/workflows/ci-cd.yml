name: CI/CD
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: ./.github/actions/install-dependencies

      - name: Run the test suite
        run: python manage.py test

  runmigrations:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: ./.github/actions/install-dependencies

      - name: Run django migrate
        run: python manage.py migrate

  migrations-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: ./.github/actions/install-dependencies

      - name: Run makemigrations
        run: python manage.py makemigrations --check

  helm-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint the chart
        run: helm lint charts/book-catalog

      - name: Render the templates
        run: helm template book-catalog charts/book-catalog > /dev/null

  build-docker-image:
    runs-on: ubuntu-latest
    needs:
      - test
      - runmigrations
      - migrations-check
      - helm-lint
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-docker-image
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The secrets context is not available in a job-level `if`, so the
      # presence check happens here and gates every cluster step below.
      - name: Check for cluster credentials
        id: check
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          if [ -n "$KUBE_CONFIG" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::KUBE_CONFIG is not set — skipping deployment."
          fi

      - name: Configure kubectl
        if: steps.check.outputs.configured == 'true'
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Set up Helm
        if: steps.check.outputs.configured == 'true'
        uses: azure/setup-helm@v4

      - name: Deploy with Helm
        if: steps.check.outputs.configured == 'true'
        run: |
          helm upgrade --install book-catalog charts/book-catalog \
            --namespace book-catalog \
            --create-namespace \
            --set image.repository=ghcr.io/${{ github.repository }} \
            --set image.tag=${{ needs.build-docker-image.outputs.image-tag }} \
            --set secrets.secretKey='${{ secrets.DJANGO_SECRET_KEY }}' \
            --set secrets.databasePassword='${{ secrets.DATABASE_PASSWORD }}' \
            --wait \
            --timeout 5m

      - name: Verify the rollout
        if: steps.check.outputs.configured == 'true'
        run: |
          kubectl rollout status deployment/book-catalog \
            --namespace book-catalog \
            --timeout 2m
